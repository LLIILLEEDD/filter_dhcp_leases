# Две подсети только на veth внутри серверного namespace.
authoritative;
ddns-update-style none;
default-lease-time 172800;
max-lease-time 172800;
min-lease-time 4;
dhcp-cache-threshold 0;
subnet 10.203.10.0 netmask 255.255.255.0 {
  range 10.203.10.100 10.203.10.110;
  option subnet-mask 255.255.255.0;
}
subnet 10.203.20.0 netmask 255.255.255.0 {
  range 10.203.20.100 10.203.20.110;
  option subnet-mask 255.255.255.0;
}
